name: PR Sandbox Destroy

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-sandbox-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  destroy:
    name: Tear Down Sandbox
    # Fork PRs never had a sandbox deployed (no secrets or OIDC access).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The merge ref may be gone after close; use the commit the sandbox was built from.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform init
        working-directory: environments/sandbox
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=sandboxes/pr-${PR_NUMBER}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform destroy
        working-directory: environments/sandbox
        run: terraform destroy -auto-approve -input=false -var="pr_number=${{ github.event.number }}" -var="created_at=cleanup"

      - name: Post teardown confirmation comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.number;
            const outcome = context.payload.pull_request.merged ? 'merged' : 'closed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '### Sandbox teardown complete',
                '',
                `PR #${prNumber} was ${outcome}. All ephemeral sandbox resources were destroyed.`,
                '',
                `- State key: \`sandboxes/pr-${prNumber}/terraform.tfstate\``,
                `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
