name: PR Sandbox Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/pr-sandbox-deploy.yml"

concurrency:
  group: pr-sandbox-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Cost Estimate & Deploy Sandbox
    # Fork PRs cannot access secrets or request an OIDC token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: environments/sandbox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost breakdown
        working-directory: .
        run: infracost breakdown --path=environments/sandbox --format=json --out-file=/tmp/infracost.json

      - name: Post Infracost comment
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=sandboxes/pr-${PR_NUMBER}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -var="pr_number=${{ github.event.number }}" -var="created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
